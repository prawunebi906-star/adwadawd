# -Dorg.gradle.native=false: Gradle's native file-events DLL needs a Windows API missing on Windows 8.1
# ("gradle-fileevents.dll: The specified procedure could not be found"), so run without native integration.
org.gradle.jvmargs=-Xmx2G -Dorg.gradle.native=false
org.gradle.vfs.watch=false
org.gradle.daemon=true
# Confirm these on https://fabricmc.net/develop (pick 1.21.11) if Gradle cannot resolve them
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.1
fabric_version=0.141.0+1.21.11
mod_version=1.0.0
maven_group=dev.rox
archives_base_name=rox
